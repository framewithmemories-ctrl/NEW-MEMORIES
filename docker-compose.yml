version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # MongoDB stays on the internal Docker network; do not expose it publicly.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=memories
    depends_on:
      - mongo
    ports:
      - "8001:8001"

volumes:
  mongo_data:
