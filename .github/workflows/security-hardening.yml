name: Security Hardening

on:
  push:
    branches: ["NEW-MEMORIES-2026"]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[security-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/server.py')
          s = path.read_text(encoding='utf-8')
          original = s

          # Customer-private resource ownership.
          replacements = [
              ('async def get_user(user_id: str):', 'async def get_user(user_id: str, owner=Depends(verify_user_access)):'),
              ('async def update_user(user_id: str, user_data: dict):', 'async def update_user(user_id: str, user_data: dict, owner=Depends(verify_user_access)):'),
              ('async def create_design(design: CustomDesignCreate):', 'async def create_design(design: CustomDesignCreate, current=Depends(get_current_user)):'),
              ('async def get_user_designs(user_id: str):', 'async def get_user_designs(user_id: str, owner=Depends(verify_user_access)):'),
              ('async def create_order(order: OrderCreate):', 'async def create_order(order: OrderCreate, current=Depends(get_current_user)):'),
              ('async def get_user_orders(user_id: str):', 'async def get_user_orders(user_id: str, owner=Depends(verify_user_access)):')
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)

          marker = 'async def create_design(design: CustomDesignCreate, current=Depends(get_current_user)):\n'
          guard = '    if design.user_id != current["id"]:\n        raise HTTPException(status_code=403, detail="Not authorized for this account")\n'
          if marker in s and 'if design.user_id != current["id"]' not in s:
              s = s.replace(marker, marker + guard, 1)

          marker = 'async def create_order(order: OrderCreate, current=Depends(get_current_user)):\n'
          guard = '    if order.user_id != current["id"]:\n        raise HTTPException(status_code=403, detail="Not authorized for this account")\n    if not order.items:\n        raise HTTPException(status_code=400, detail="Order must contain at least one item")\n    if order.total_amount <= 0:\n        raise HTTPException(status_code=400, detail="Order total must be greater than 0")\n    if order.delivery_type not in ("pickup", "delivery"):\n        raise HTTPException(status_code=400, detail="Invalid delivery type")\n    if order.delivery_type == "delivery" and not order.delivery_address:\n        raise HTTPException(status_code=400, detail="Delivery address is required")\n'
          if marker in s and 'if order.user_id != current["id"]' not in s:
              s = s.replace(marker, marker + guard, 1)

          # Product creation is administrative only.
          s = s.replace(
              'async def create_product(product: ProductCreate):',
              'async def create_product(product: ProductCreate, admin=Depends(require_admin)):',
              1,
          )

          # Bound image uploads and validate declared media type.
          old = "    if not file.content_type.startswith('image/'):\n        raise HTTPException(status_code=400, detail=\"File must be an image (JPG, PNG, HEIC)\")\n    \n    # Read and process image\n    contents = await file.read()\n"
          new = '    content_type = (file.content_type or "").lower()\n    allowed_types = {"image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"}\n    if content_type not in allowed_types:\n        raise HTTPException(status_code=400, detail="Only JPG, PNG, WEBP, HEIC, or HEIF images are allowed")\n    max_bytes = 10 * 1024 * 1024\n    contents = await file.read(max_bytes + 1)\n    if len(contents) > max_bytes:\n        raise HTTPException(status_code=413, detail="Image is too large. Maximum size is 10 MB.")\n    if not contents:\n        raise HTTPException(status_code=400, detail="Image file is empty")\n    \n    # Read and process image\n'
          if old in s:
              s = s.replace(old, new, 1)

          # Wallet amount validation.
          s = s.replace(
              'async def add_money_to_wallet(user_id: str, amount: float, owner=Depends(verify_user_access)):\n    user = await db.users.find_one({"id": user_id})',
              'async def add_money_to_wallet(user_id: str, amount: float, owner=Depends(verify_user_access)):\n    if not isinstance(amount, (int, float)) or not math.isfinite(amount) or amount <= 0 or amount > 100000:\n        raise HTTPException(status_code=400, detail="Amount must be a finite positive value up to ₹100,000")\n    user = await db.users.find_one({"id": user_id})', 1)
          s = s.replace(
              'async def convert_points_to_credits(user_id: str, points: int, owner=Depends(verify_user_access)):\n    user = await db.users.find_one({"id": user_id})',
              'async def convert_points_to_credits(user_id: str, points: int, owner=Depends(verify_user_access)):\n    if not isinstance(points, int) or points <= 0 or points > 1000000:\n        raise HTTPException(status_code=400, detail="Points must be a positive whole number")\n    user = await db.users.find_one({"id": user_id})', 1)
          s = s.replace(
              'async def pay_with_wallet(user_id: str, amount: float, order_id: str, owner=Depends(verify_user_access)):\n    user = await db.users.find_one({"id": user_id})',
              'async def pay_with_wallet(user_id: str, amount: float, order_id: str, owner=Depends(verify_user_access)):\n    if not isinstance(amount, (int, float)) or not math.isfinite(amount) or amount <= 0 or amount > 100000:\n        raise HTTPException(status_code=400, detail="Amount must be a finite positive value up to ₹100,000")\n    if not order_id or len(order_id) > 100:\n        raise HTTPException(status_code=400, detail="Invalid order id")\n    existing_txn = await db.wallet_transactions.find_one({"user_id": user_id, "order_id": order_id, "type": "debit", "status": "completed"})\n    if existing_txn:\n        return {"payment_successful": True, "new_balance": existing_txn.get("balance_after", 0.0), "tier": owner.get("tier", "Silver"), "transaction_id": existing_txn["id"], "idempotent": True}\n    user = await db.users.find_one({"id": user_id})', 1)

          # Required for finite-number validation.
          if 'import math\n' not in s:
              s = s.replace('import io\n', 'import io\nimport math\n', 1)

          # Atomic wallet debit: prevent concurrent double-spend/negative balance.
          old = '''    new_balance = current_balance - amount
    new_total_spent = user.get("total_spent", 0.0) + amount
    
    # Update tier based on total spent
'''
          new = '''    new_balance = current_balance - amount
    new_total_spent = user.get("total_spent", 0.0) + amount
    
    debit_result = await db.users.update_one(
        {"id": user_id, "wallet_balance": {"$gte": amount}},
        {"$inc": {"wallet_balance": -amount, "total_spent": amount}}
    )
    if debit_result.modified_count != 1:
        raise HTTPException(status_code=400, detail="Wallet balance changed or is insufficient. Please try again.")
    user = await db.users.find_one({"id": user_id})
    new_balance = user.get("wallet_balance", 0.0)
    new_total_spent = user.get("total_spent", 0.0)
    
    # Update tier based on total spent
'''
          if old in s:
              s = s.replace(old, new, 1)

          # Remove the old non-atomic write from pay_with_wallet.
          old = '''    # Update user
    await db.users.update_one(
        {"id": user_id},
        {
            "$set": {
                "wallet_balance": new_balance,
                "total_spent": new_total_spent,
                "tier": new_tier
            }
        }
    )
    
    # Record transaction
'''
          new = '''    await db.users.update_one(
        {"id": user_id},
        {"$set": {"tier": new_tier}}
    )
    
    # Record transaction
'''
          if old in s:
              s = s.replace(old, new, 1)

          # Mark wallet-paid orders after successful debit.
          needle = '    await db.wallet_transactions.insert_one(transaction.dict())\n    \n    return {\n        "payment_successful": True,'
          replacement = '    await db.wallet_transactions.insert_one(transaction.dict())\n    await db.orders.update_one({"id": order_id, "user_id": user_id}, {"$set": {"status": "paid", "paid_at": datetime.now(timezone.utc)}})\n    \n    return {\n        "payment_successful": True,'
          if needle in s and replacement not in s:
              s = s.replace(needle, replacement, 1)

          if s != original:
              path.write_text(s, encoding='utf-8')
              print('Applied backend hardening changes.')
          else:
              print('No changes required.')
          compile(s, str(path), 'exec')
          print('server.py syntax check: OK')

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          if git diff --cached --quiet; then
            echo "No backend changes to commit."
          else
            git commit -m "Apply production security hardening [security-hardening]"
            git push origin HEAD:NEW-MEMORIES-2026
          fi
